<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Blank Launcher: Digital Detox</title>

<!-- SEO -->
<meta name="description" content="Un launcher minimalista para Android. Pantalla negra, reloj, tus apps. Nada que compita por tu atención.">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="Blank Launcher: Digital Detox">
<meta property="og:description" content="El launcher que no compite por tu atención. Pantalla negra OLED, sin widgets, sin notificaciones.">
<meta property="og:image" content="https://blankapps.github.io/img/og.png">
<meta property="og:url" content="https://blankapps.github.io/">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Blank Launcher: Digital Detox">
<meta name="twitter:description" content="El launcher que no compite por tu atención.">
<meta name="twitter:image" content="https://blankapps.github.io/img/og.png">

<style>
  :root {
    --bg: #000000;
    --fg: #FFFFFF;
    --secondary: #AAAAAA;
    --subtle: #666666;
    --disabled: #444444;
    --border: #1a1a1a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 960px; margin: 0 auto; padding: 0 24px; }

  /* Top bar */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 0;
  }
  .brand { font-size: 15px; letter-spacing: 0.5px; color: var(--secondary); }
  .lang-toggle { display: flex; gap: 4px; font-size: 13px; }
  .lang-toggle button {
    background: none; border: none; color: var(--subtle);
    cursor: pointer; padding: 4px 8px; font-size: 13px; letter-spacing: 0.5px;
  }
  .lang-toggle button.active { color: var(--fg); }
  .lang-toggle .sep { color: var(--disabled); align-self: center; }

  /* Hero */
  .hero {
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 56px 0 88px;
  }
  .hero-text { flex: 1; }
  .hero h1 {
    font-size: 42px; font-weight: 600; line-height: 1.15;
    letter-spacing: -0.5px; margin-bottom: 20px;
  }
  .hero p.sub {
    font-size: 18px; color: var(--secondary);
    margin-bottom: 32px; max-width: 420px;
  }
  .cta {
    display: inline-block; background: var(--fg); color: var(--bg);
    text-decoration: none; padding: 14px 28px; border-radius: 8px;
    font-weight: 600; font-size: 15px; transition: opacity 0.15s;
  }
  .cta:hover { opacity: 0.85; }

  .hero-visual { flex: 0 0 auto; width: 300px; }
  .hero-visual img {
    width: 100%; height: auto; display: block; border-radius: 16px;
  }

  /* Features */
  .features { padding: 24px 0 72px; }
  .features-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 32px 40px;
  }
  .feature .label {
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--subtle); margin-bottom: 8px;
  }
  .feature .title { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  .feature .desc { font-size: 15px; color: var(--secondary); }

  /* Screenshots strip */
  .shots { padding: 40px 0 72px; }
  .shots h2 {
    font-size: 24px; font-weight: 600; margin-bottom: 40px; text-align: center;
  }
  .shots-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    align-items: start;
  }
  .shot img { width: 100%; height: auto; display: block; border-radius: 14px; }
  .shot .caption {
    font-size: 14px; color: var(--secondary);
    text-align: center; margin-top: 14px;
  }

  /* Closing CTA */
  .closing {
    text-align: center; padding: 64px 0 80px;
    border-top: 1px solid var(--border);
  }
  .closing h2 {
    font-size: 28px; font-weight: 600; margin-bottom: 12px; letter-spacing: -0.3px;
  }
  .closing p { color: var(--secondary); margin-bottom: 28px; }

  /* Footer */
  footer {
    border-top: 1px solid var(--border);
    padding: 32px 0 48px;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--subtle);
  }
  footer a { color: var(--secondary); text-decoration: none; }
  footer a:hover { color: var(--fg); }
  footer .links { display: flex; gap: 24px; }

  /* Mobile */
  @media (max-width: 720px) {
    .hero {
      flex-direction: column; text-align: center; gap: 36px; padding: 32px 0 56px;
    }
    .hero p.sub { margin-left: auto; margin-right: auto; }
    .hero h1 { font-size: 32px; }
    .hero-visual { width: 220px; }
    .shots-row { grid-template-columns: 1fr; max-width: 300px; margin: 0 auto; gap: 40px; }
    footer { flex-direction: column; text-align: center; }
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- Top bar -->
  <div class="topbar">
    <div class="brand">Blank Apps</div>
    <div class="lang-toggle">
      <button id="btn-es" onclick="setLang('es')">ES</button>
      <span class="sep">/</span>
      <button id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </div>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-text">
      <h1 data-i18n="hero_title"></h1>
      <p class="sub" data-i18n="hero_sub"></p>
      <a class="cta" href="https://play.google.com/store/apps/details?id=com.blanklauncher.app" data-i18n="cta"></a>
    </div>
    <div class="hero-visual">
      <img src="img/hero.jpg" alt="Blank Launcher home screen">
    </div>
  </section>

  <!-- Features -->
  <section class="features">
    <div class="features-grid">
      <div class="feature">
        <div class="label">home</div>
        <div class="title" data-i18n="f1_title"></div>
        <div class="desc" data-i18n="f1_desc"></div>
      </div>
      <div class="feature">
        <div class="label">friction</div>
        <div class="title" data-i18n="f2_title"></div>
        <div class="desc" data-i18n="f2_desc"></div>
      </div>
      <div class="feature">
        <div class="label">focus</div>
        <div class="title" data-i18n="f3_title"></div>
        <div class="desc" data-i18n="f3_desc"></div>
      </div>
      <div class="feature">
        <div class="label">display</div>
        <div class="title" data-i18n="f4_title"></div>
        <div class="desc" data-i18n="f4_desc"></div>
      </div>
      <div class="feature">
        <div class="label">always</div>
        <div class="title" data-i18n="f5_title"></div>
        <div class="desc" data-i18n="f5_desc"></div>
      </div>
    </div>
  </section>

  <!-- Screenshots -->
  <section class="shots">
    <h2 data-i18n="shots_title"></h2>
    <div class="shots-row">
      <div class="shot">
        <img src="img/friction.jpg" alt="10 second pause">
        <div class="caption" data-i18n="cap_friction"></div>
      </div>
      <div class="shot">
        <img src="img/focus.jpg" alt="Focus block">
        <div class="caption" data-i18n="cap_focus"></div>
      </div>
      <div class="shot">
        <img src="img/screentime.jpg" alt="Screen time">
        <div class="caption" data-i18n="cap_screentime"></div>
      </div>
    </div>
  </section>

  <!-- Closing CTA -->
  <section class="closing">
    <h2 data-i18n="closing_title"></h2>
    <p data-i18n="closing_sub"></p>
    <a class="cta" href="https://play.google.com/store/apps/details?id=com.blanklauncher.app" data-i18n="cta"></a>
  </section>

  <!-- Footer -->
  <footer>
    <div>© 2026 Blank Apps</div>
    <div class="links">
      <a href="https://play.google.com/store/apps/details?id=com.blanklauncher.app" data-i18n="footer_play"></a>
      <a href="mailto:blankappsdev@gmail.com" data-i18n="footer_support"></a>
    </div>
  </footer>

</div>

<script>
  const i18n = {
    es: {
      hero_title: "El launcher que no compite por tu atención",
      hero_sub: "Pantalla negra, reloj, tus apps. Nada de widgets, notificaciones ni ruido visual.",
      cta: "Descargar en Android",
      f1_title: "Solo lo esencial",
      f1_desc: "Sin íconos de colores, sin widgets, sin badges. Reloj y tus apps.",
      f2_title: "Pausa de 10 segundos",
      f2_desc: "Un respiro antes de abrir las apps que te distraen.",
      f3_title: "Horas de foco",
      f3_desc: "Programá franjas sin distracciones y bloqueá apps por horario.",
      f4_title: "Negro puro",
      f4_desc: "Fondo OLED real. Descansa la vista y ahorra batería.",
      f5_title: "Sin ruido",
      f5_desc: "Sin ads, sin tracking, sin notificaciones. Nunca.",
      shots_title: "Así se ve",
      cap_friction: "Una pausa antes de abrir lo que te distrae.",
      cap_focus: "Bloqueá apps por horario.",
      cap_screentime: "Mirá tu tiempo de pantalla real.",
      closing_title: "Menos pantalla. Más presente.",
      closing_sub: "Pago único, sin suscripción.",
      footer_play: "Google Play",
      footer_support: "Soporte"
    },
    en: {
      hero_title: "The launcher that won't compete for your attention",
      hero_sub: "Black screen, clock, your apps. No widgets, no notifications, no visual noise.",
      cta: "Get it on Android",
      f1_title: "Only the essentials",
      f1_desc: "No colorful icons, no widgets, no badges. Just a clock and your apps.",
      f2_title: "10-second pause",
      f2_desc: "A breath before you open the apps that distract you.",
      f3_title: "Focus hours",
      f3_desc: "Schedule distraction-free windows and block apps by time.",
      f4_title: "Pure black",
      f4_desc: "True OLED background. Easy on the eyes, easy on the battery.",
      f5_title: "No noise",
      f5_desc: "No ads, no tracking, no notifications. Ever.",
      shots_title: "See it",
      cap_friction: "A pause before you open what distracts you.",
      cap_focus: "Block apps by schedule.",
      cap_screentime: "See your real screen time.",
      closing_title: "Less screen. More present.",
      closing_sub: "One-time purchase, no subscription.",
      footer_play: "Google Play",
      footer_support: "Support"
    }
  };

  function setLang(lang) {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (i18n[lang][key]) el.textContent = i18n[lang][key];
    });
    document.getElementById('btn-es').classList.toggle('active', lang === 'es');
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    try { localStorage.setItem('blank_lang', lang); } catch(e) {}
  }

  (function() {
    let lang = null;
    try { lang = localStorage.getItem('blank_lang'); } catch(e) {}
    if (!lang) {
      const nav = (navigator.language || 'es').toLowerCase();
      lang = nav.startsWith('es') ? 'es' : 'en';
    }
    setLang(lang);
  })();
</script>

</body>
</html>
